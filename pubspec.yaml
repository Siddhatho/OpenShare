name: openshare
description: Local-only phone-to-phone file sharing over same Wi-Fi.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  dio: ^5.8.0+1
  file_picker: ^10.2.0
  mobile_scanner: ^7.0.1
  nsd: ^4.0.3
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shelf: ^1.4.2
  saver_gallery: ^5.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
